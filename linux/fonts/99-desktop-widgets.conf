<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    兜底：部分挂件写死了字体族名 FZSongHei-B07。
    把它别名到 sans-serif（即桌面默认无衬线字体，本机为方正宋黑），
    保证即便挂件源码未更新，渲染也跟随系统默认字体。
  -->
  <alias binding="strong">
    <family>FZSongHei-B07</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>
</fontconfig>
